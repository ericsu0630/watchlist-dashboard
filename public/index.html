<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watchlist</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231A1A1A'/%3E%3Cpath d='M9 20v-7M9 11v-2M16 23v-11M16 10V8M23 17v-6M23 9V7' stroke='%2334D3A0' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preload" href="/fonts/barlow-semi-condensed/barlow-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/barlow-semi-condensed/barlow-semi-condensed-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/inter-tight/inter-tight-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M9 20v-7M9 11v-2M16 23v-11M16 10V8M23 17v-6M23 9V7" /></svg>
      <span>Watchlist</span>
      <span class="count" id="count"></span>
    </div>

    <div class="find">
    <button class="news-btn" id="news-btn" type="button" aria-controls="news" aria-expanded="false" title="Latest headlines for your symbols">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="10" height="10.5" rx="1.5"/><path d="M11.75 5.5h1.5a1 1 0 0 1 1 1v5.25a1.5 1.5 0 0 1-3 0M4.25 5.75h5M4.25 8h5M4.25 10.25h3"/></svg>
      <span>News</span>
    </button>
    <div class="search" id="search">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></svg>
      <input id="search-input" type="search" autocomplete="off" spellcheck="false"
             placeholder="Add a symbol — AAPL, 2330, BTCUSDT…"
             role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list"
             aria-label="Search symbols to add">
      <kbd class="search-key" aria-hidden="true">/</kbd>
      <ul id="search-results" class="results" role="listbox" hidden></ul>
    </div>
    </div>

    <div class="controls">
      <button class="sort" id="sort" type="button" data-sort="none" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path class="s-a" d="M3 4h4M3 8h6.5M3 12h9"/><path class="s-b" d="M12.5 3v9m0 0-2-2m2 2 2-2"/></svg>
        <span>Unsorted</span>
      </button>
      <div class="tf" id="tf" role="radiogroup" aria-label="Candle interval"></div>
      <label class="zoom" title="Candle width (double-click to reset)">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10M8 5v6M12 2v11"/></svg>
        <input id="zoom-input" type="range" min="1" max="15" step="1" aria-label="Candle width">
        <svg class="wide" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="4" width="4.5" height="8" rx="1"/><rect x="9.5" y="2" width="4.5" height="11" rx="1"/></svg>
        <output id="zoom-value" for="zoom-input"></output>
      </label>
      <div class="conn" id="conn" role="status" aria-live="polite"><i></i><span>Connecting</span></div>
    </div>

    <nav class="tabs" id="tabs" aria-label="Symbol groups">
      <div class="tab-list" id="tab-list" role="tablist" aria-label="Symbol groups"></div>
      <button class="tab-add" id="tab-add" type="button" aria-label="Add a tab" title="Add a tab">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
      </button>
    </nav>
  </header>

  <!-- Right-click menus for tiles and tabs, and the delete-tab confirmation. -->
  <div class="menu" id="menu" role="menu" hidden></div>
  <dialog class="confirm" id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="confirm-actions">
        <button type="submit" value="cancel">Cancel</button>
        <button type="submit" value="ok" class="danger" id="confirm-ok">Delete</button>
      </div>
    </form>
  </dialog>
  <div class="sr-only" id="announce" role="status" aria-live="polite"></div>

  <div class="demo-note" id="demo-note" hidden>Demo mode: prices are simulated. Run <code>npm start</code> for live TradingView data.</div>

  <main>
    <section class="grid" id="grid" role="tabpanel"></section>

    <section class="empty" id="empty" hidden>
      <h1 id="empty-title">Nothing on your board yet</h1>
      <p id="empty-text">Search for a stock, ETF, index, currency pair or crypto pair above to start tracking it. Or pick one to begin:</p>
      <div class="chips" id="chips"></div>
    </section>

    <section class="news" id="news" hidden aria-labelledby="news-title">
      <div class="news-head">
        <button class="news-back" id="news-back" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>
          <span>Charts</span>
        </button>
        <div class="news-titles">
          <h1 id="news-title">News</h1>
          <p class="news-sub" id="news-sub"></p>
        </div>
        <button class="news-refresh" id="news-refresh" type="button" aria-label="Refresh headlines" title="Refresh headlines">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.25 8a5.25 5.25 0 1 1-1.54-3.71M13.25 2.75v3h-3"/></svg>
        </button>
      </div>
      <div class="news-tabs" id="news-tabs" role="group" aria-label="Show headlines for a tab" hidden></div>
      <div class="news-filter" id="news-filter" role="group" aria-label="Show headlines for a symbol"></div>
      <p class="news-note" id="news-note" hidden></p>
      <div class="news-list" id="news-list"></div>
    </section>
  </main>

  <template id="tile-tpl">
    <article class="tile" tabindex="-1">
      <header class="tile-head">
        <button class="grip" type="button" title="Drag to reorder (or focus and use ← →)">
          <svg viewBox="0 0 10 16" aria-hidden="true"><circle cx="2.5" cy="3" r="1.3"/><circle cx="7.5" cy="3" r="1.3"/><circle cx="2.5" cy="8" r="1.3"/><circle cx="7.5" cy="8" r="1.3"/><circle cx="2.5" cy="13" r="1.3"/><circle cx="7.5" cy="13" r="1.3"/></svg>
        </button>
        <div class="ident">
          <div class="ticker"></div>
          <div class="meta"><i class="session" hidden></i><span class="exch"></span><span class="name"></span></div>
        </div>
        <div class="quote">
          <div class="price">—</div>
          <div class="change"></div>
        </div>
        <button class="remove" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8"/></svg>
        </button>
      </header>
      <div class="chart-wrap">
        <div class="chart"></div>
        <div class="state"><span>Loading chart</span></div>
        <span class="delay" hidden></span>
      </div>
    </article>
  </template>

  <script src="/vendor/lightweight-charts.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
